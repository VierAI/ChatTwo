punchline: Electric Boogaloo - ♪ A whole new chat, a new fantastic chat window ♪ Unofficial VierAI-fied fork (AI generated code).
description: |-
  Chat 2 is a complete rewrite of the in-game chat window as a plugin.
  It supports:

  - Unlimited tabs
  - Tabs that always send to a certain channel
  - More flexible filtering
  - RGB channel colouring
  - Completely variable font size
  - Sidebar tabs
  - Unread counts
  - Emotes
  - Screenshot mode (obfuscate names)

  Chat 2 by Infi, Anna - VierAI-fied

  Forked from the official Chat 2 (https://github.com/Infiziert90/ChatTwo).

  AI generated code: unofficial build, not supported by the original authors. Do not report issues from this build upstream.


  Added:
  - Spell checker with hover suggestions
  - Up/Down message history (shared with XIM)
  - Single-match Tab completion fills in directly
  - Shout keybind and /chat2keys diagnostics
  - Installer main window button shows the chat
  - Imports the official Chat 2 settings

  Fixed:
  - Tab completion inserting <at:...> codes
  - More responsive typing (no delayed or dropped keys)
  - Messages could be lost from the queue
  - No database clash with the official Chat 2
  - Lighter keybind and message processing
